<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <fieldset>
      <legend>User information</legend>
      <table>
        <tr>
          <td>
            First Name <input type="text" placeholder="Enter first name..." />
          </td>
          <td>
            Last Name <input type="text" placeholder="Enter Last name..." />
          </td>
        </tr>
        <tr>
          <td>
            Graduation Year :
            <select>
              <option value="2020">2020</option>
              <option value="2021">2021</option>
              <option value="2022">2022</option>
              <option value="2023">2023</option>
              <option value="2024">2024</option>
              <option value="2025">2025</option>
              <option value="2026">2026</option>
            </select>
          </td>
          <td>
            Branch
            <input type="radio" name="branch" />BCA
            <input type="radio" name="branch" />B-tech
            <input type="radio" name="branch" />BBA
          </td>
        </tr>
      </table>
    </fieldset>
    <button>Submit</button>
  </body>
</html>
